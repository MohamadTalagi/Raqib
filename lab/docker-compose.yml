name: kaust-iot-lab

networks:
  audit-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  internal-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  device-insecure:
    build: ./devices/smart-camera
    env_file: ./devices/smart-camera/profiles/insecure.env
    networks:
      - audit-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  telnet-sim:
    build: ./telnet-sim
    networks:
      - audit-network
    healthcheck:
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 23 < /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

  traffic-capture:
    build: ./traffic-capture
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../document-store/pcap:/pcap
    networks:
      - audit-network

  mqtt-broker-insecure:
    image: eclipse-mosquitto:2
    volumes:
      - ./mqtt/insecure/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - audit-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  cert-init:
    build: ./certs
    volumes:
      - ./certs:/out
    profiles: ["init"]

  device-partial:
    build: ./devices/smart-camera
    env_file: ./devices/smart-camera/profiles/partial.env
    volumes:
      - ./certs:/certs:ro
    networks:
      - audit-network
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; ctx.set_ciphers('DEFAULT@SECLEVEL=0'); urllib.request.urlopen('https://localhost/health', context=ctx, timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  device-hardened:
    build: ./devices/smart-camera
    env_file: ./devices/smart-camera/profiles/hardened.env
    volumes:
      - ./certs:/certs:ro
    networks:
      - audit-network
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen('https://localhost/health', context=ctx, timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  mqtt-broker-secure:
    image: eclipse-mosquitto:2
    volumes:
      - ./mqtt/secure/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
      - mqtt-secure-passwd:/mosquitto/config
    networks:
      - audit-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8883 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  auditor-worker:
    build: ./auditor/worker
    environment:
      - PYTHONPATH=/work
      - AUDITOR_API_URL=http://auditor-api:8000
    volumes:
      - ../policies:/work/policies:ro
      - ./auditor/worker:/work/lab/auditor/worker
      - ./auditor/api/device_validation.py:/work/device_validation.py:ro
      - ../document-store:/work/document-store
    networks:
      - audit-network
      - internal-network
    depends_on:
      - auditor-api

  auditor-database:
    build: ./auditor/db
    environment:
      - POSTGRES_DB=auditor
      - POSTGRES_USER=auditor
      - POSTGRES_PASSWORD=auditor-lab-pw
    volumes:
      - auditor-db-data:/var/lib/postgresql/data
    networks:
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 10s
      timeout: 3s
      retries: 5

  auditor-api:
    build: ./auditor/api
    environment:
      - DATABASE_URL=postgresql://auditor:auditor-lab-pw@auditor-database:5432/auditor
      - PYTHONPATH=/work
      - DOCUMENT_STORE_DIR=/work/document-store
    volumes:
      - ../policies:/work/policies:ro
      - ../document-store:/work/document-store
    networks:
      - internal-network
    depends_on:
      auditor-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  auditor-web:
    build: ./auditor/web
    ports:
      - "8080:80"
    networks:
      - internal-network
    depends_on:
      - auditor-api

volumes:
  mqtt-secure-passwd:
  auditor-db-data:
