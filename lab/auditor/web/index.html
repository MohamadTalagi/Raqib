<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoTGuard — NCA Compliance Dashboard</title>
    <script>
      // Applied before first paint so the page never flashes the wrong
      // theme while React hydrates - useTheme.ts is the source of truth
      // for this key/attribute, kept in sync there.
      (function () {
        var stored = localStorage.getItem("iotguard-theme");
        if (stored === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
