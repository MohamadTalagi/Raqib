# Overlay for local development only — exposes device ports to localhost.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Default (docker-compose.yml alone) does NOT expose these, per the brief:
# "services reachable only inside the lab".
#
# internal-network is marked internal:true in the base file (its whole point
# is that the trusted backend has no route out) — but that same isolation
# also blocks Docker Desktop's host-port-forwarding proxy from reaching any
# container whose only network is internal-network, even for ports declared
# as published. auditor-api and auditor-web live only on internal-network, so
# their dev-published ports (8000, 8080) silently never bind on Windows/Mac
# Docker Desktop. Relaxing internal:true here (dev overlay only, never in the
# base file) is what actually makes the publish take effect.
networks:
  internal-network:
    internal: false
services:
  device-insecure:
    ports:
      - "8081:80"
  device-partial:
    ports:
      - "8082:443"
  device-hardened:
    ports:
      - "8083:443"
  device-smartlock:
    ports:
      - "8084:80"
  device-plc-gateway:
    ports:
      - "8085:80"
      - "5020:502"
  device-router-gw:
    ports:
      - "8086:80"
      - "19000:1900/udp"
  device-nvr:
    ports:
      - "8087:80"
      - "5540:554"
  device-speaker:
    ports:
      - "8088:80"
      - "15353:5353/udp"
  mqtt-broker-insecure:
    ports:
      - "18830:1883"
  auditor-api:
    ports:
      - "8000:8000"
