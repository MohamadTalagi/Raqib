control_id: SA-IOT-003
title: Disable unnecessary network services
version: "1.0.0"
saudi_source:
  - framework: CGIoT-1:2024
    reference: "2-15-2"
    clause: "Disable all unnecessary network services and interfaces on the device."
  - framework: CGIoT-1:2024
    reference: "Appendix A #3"
    clause: "Minimize the device's exposed attack surface."
applicability:
  device_type: [smart-camera]
required_evidence:
  - test_id: TEST-NET-PORTSCAN
automated_test_ids: [TEST-NET-PORTSCAN]
severity: high
conditions:
  pass: { field: "observations.open_ports", op: "not_contains", value: 23 }
  fail: { field: "observations.open_ports", op: "contains", value: 23 }
  partial: null
  inconclusive: { when: "evidence_missing_or_low_confidence" }
remediation: "Remove Telnet and any other non-essential listening service from the device image."
limitations: "Only flags Telnet (port 23) specifically; a full port-range scan runs and records every open port in observations.services, but the pass/fail condition itself only keys on Telnet, so other unnecessary services must be reviewed by hand from the same scan's output."
